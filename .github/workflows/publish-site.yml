name: Validate and publish site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://maksimas-win.github.io/bukiskis-parama/
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and test all six languages
        run: |
          npm run build
          npm test
      - name: Require committed output to match the tested build
        run: |
          git diff --exit-code -- docs
          test -z "$(git ls-files --others --exclude-standard docs)"
      - name: Install development-only browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/site-qa" --no-audit --no-fund --save-exact playwright@1.56.1
          "$RUNNER_TEMP/site-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check responsive layouts, motion fallbacks and helper interaction
        env:
          PLAYWRIGHT_PACKAGE_JSON: ${{ runner.temp }}/site-qa/package.json
        run: |
          node scripts/check-intro3d.mjs
          node scripts/check-gpm-helper.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: |
            qa/intro3d-review
            qa/gpm-review
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare tested Pages artifact
        if: github.repository == 'Maksimas-win/bukiskis-parama' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    if: github.repository == 'Maksimas-win/bukiskis-parama' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact that passed all checks
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Compare live files with the tested release
        run: npm run check:live
      - name: Save deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-verification
          path: qa/live
          if-no-files-found: ignore
          retention-days: 7
